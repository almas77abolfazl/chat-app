name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27018:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chat-app-back/package-lock.json

      - name: Install backend dependencies
        working-directory: chat-app-back
        run: npm ci

      - name: Run lint
        working-directory: chat-app-back
        run: npm run lint

      - name: Run unit tests
        working-directory: chat-app-back
        run: npm test

      - name: Run E2E tests
        working-directory: chat-app-back
        env:
          MONGO_URI: mongodb://127.0.0.1:27018/chat-app-test
        run: npm run test:e2e
