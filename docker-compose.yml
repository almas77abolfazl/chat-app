services:
  mongo:
    image: mongo:7
    container_name: chat-app-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: chat-app
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./chat-app-back
      dockerfile: Dockerfile
    container_name: chat-app-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: ./chat-app-back/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/chat-app
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-do-not-use-in-production}
    volumes:
      - uploads-data:/usr/src/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./chat-app-front
      dockerfile: Dockerfile
    container_name: chat-app-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mongo-data:
  uploads-data:
