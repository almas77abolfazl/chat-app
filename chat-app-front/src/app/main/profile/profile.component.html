<h2 class="dialog-title" mat-dialog-title>Profile</h2>
<div mat-dialog-content class="profile-container">
  <div class="profile-header">
    <div class="profile-picture">
      <img src="{{ data?.avatar }}" alt="Profile Picture" />
      <label for="profile-picture-upload" class="change-picture">
        <fa-icon [icon]="['fas', 'camera']"></fa-icon>
      </label>
    </div>
  </div>

  <div class="profile-form">
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" [(ngModel)]="data.firstName" class="form-control" />
    </div>

    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" [(ngModel)]="data.lastName" class="form-control" />
    </div>

    <div class="form-group">
      <label for="bio">Bio</label>
      <!-- <textarea id="bio" [(ngModel)]="data.bio" class="form-control"></textarea> -->
    </div>
  </div>
  <div mat-dialog-actions class="profile-footer"></div>
</div>
