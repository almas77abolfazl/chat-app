<div class="chat-list-container">
  <div class="chat-list">
    <div class="search-container">
      <input
        type="text"
        placeholder="Search"
        class="search-input"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange($event)"
      />
      <fa-icon [icon]="['fas', 'search']" class="search-icon"></fa-icon>
    </div>

    @if (searchResults.length > 0) {

    <div class="search-results">
      @for (result of searchResults; track $index) {
      <div class="search-result-item" (click)="selectChat(result)">
        <div class="result-name">
          {{ result.firstName + " " + result.lastName }}
        </div>
        <div class="result-type">{{ "awli" }}</div>
        <!-- مثلا یوزر یا چنل -->
      </div>
      }
    </div>
    } @for (item of mainService.chatItems; track $index) {
    <div class="chat-item">
      <div class="avatar" item.avatar></div>
      <div class="chat-info">
        <div class="chat-name">{{ item.chatName }}</div>
        <div class="last-message">{{ item.lastMessage }}</div>
      </div>
      <div class="message-time">{{ item.messageTime }}</div>
      <div class="message-count">{{ item.messageCount }}</div>
    </div>
    }
  </div>
  <div class="contacts-button-container" (click)="mainService.showContacts()">
    <fa-icon [icon]="['fas', 'user-plus']" class="show-contacts"></fa-icon>
  </div>
</div>
