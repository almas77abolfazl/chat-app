<div class="chat-list-container">
  <div class="chat-list">
    <div class="search-container">
      <input type="text" placeholder="Search" class="search-input" />
      <fa-icon [icon]="['fas', 'search']" class="search-icon"></fa-icon>
    </div>
    <div class="chat-item">
      <div class="avatar"></div>
      <div class="chat-info">
        <div class="chat-name">Design chat</div>
        <div class="last-message">Jessie Rollins sent a message</div>
      </div>
      <div class="message-time">4m</div>
      <div class="message-count">1</div>
    </div>
  </div>
  <div class="contacts-button-container" (click)="mainService.showContacts()">
    <fa-icon [icon]="['fas', 'user-plus']" class="show-contacts"></fa-icon>
  </div>
</div>
