<div class="sidebar">
  <div class="sidebar-header">
    <div class="menu-item">
      <fa-icon [icon]="['fas', 'comments']"></fa-icon>
      All chats
    </div>

    @for (item of customItems; track $index) {
    <div class="menu-item">
      <fa-icon [icon]="['fas', item.icon]"></fa-icon>
      {{ item.title }}
    </div>
    }
  </div>

  <div class="sidebar-footer">
    ------------
    <div class="menu-item" (click)="mainService.openEditProfileModal()">
      <fa-icon [icon]="['fas', 'user-circle']"></fa-icon>
      Profile
    </div>
    <div class="menu-item" (click)="mainService.logout()">
      <fa-icon [icon]="['fas', 'sign-out-alt']"></fa-icon>
      Log out
    </div>
  </div>
</div>
