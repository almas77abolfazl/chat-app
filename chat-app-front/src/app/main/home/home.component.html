<div class="chat-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="menu-item">
      <fa-icon [icon]="['fas', 'comments']"></fa-icon>
      All chats
    </div>
    <div class="menu-item">
      <fa-icon [icon]="['fas', 'briefcase']"></fa-icon>
      Work
    </div>
    <div class="menu-item">
      <fa-icon [icon]="['fas', 'user-friends']"></fa-icon>
      Friends
    </div>
    <div class="menu-item">
      <fa-icon [icon]="['fas', 'newspaper']"></fa-icon>
      News
    </div>
    <div class="menu-item">
      <fa-icon [icon]="['fas', 'archive']"></fa-icon>
      Archive chats
    </div>
    <div class="menu-item">
      <fa-icon [icon]="['fas', 'user-circle']"></fa-icon>
      Profile
    </div>
    <div class="menu-item">
      <fa-icon [icon]="['fas', 'sign-out-alt']"></fa-icon>
      Log out
    </div>
  </div>

  <!-- Chat List -->
  <div class="chat-list">
    <div class="chat-item">
      <div class="avatar"></div>
      <div class="chat-info">
        <div class="chat-name">Design chat</div>
        <div class="last-message">Jessie Rollins sent a message</div>
      </div>
      <div class="message-time">4m</div>
      <div class="message-count">1</div>
    </div>
    <!-- More chat items... -->
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <div class="chat-header">
      <div class="chat-title">Design chat</div>
      <div class="chat-info">23 members, 10 online</div>
      <div class="chat-options">
        <fa-icon [icon]="['fas', 'search']" class="icon"></fa-icon>
        <fa-icon [icon]="['fas', 'ellipsis-h']" class="icon"></fa-icon>
      </div>
    </div>

    <div class="chat-messages">
      <div class="message">
        <div class="avatar"></div>
        <div class="message-content">
          <div class="message-author">Jasmin Lowery</div>
          <div class="message-text">
            I added new flows to our design system...
          </div>
        </div>
        <div class="message-time">09:23</div>
      </div>
      <!-- More messages... -->
    </div>

    <div class="chat-input">
      <input type="text" placeholder="Your message" />
      <fa-icon [icon]="['fas', 'paper-plane']" class="send-icon"></fa-icon>
    </div>
  </div>
</div>
