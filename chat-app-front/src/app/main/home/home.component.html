<div class="home-container" [class.chat-open]="mainService.currentChat">
  <app-side-bar
    class="side-bar"
    [class.mobile-open]="mobileMenuOpen()"
    [mobileOpen]="mobileMenuOpen()"
    (close)="closeMobileMenu()"
  ></app-side-bar>

  @if (mobileMenuOpen() && isMobile()) {
  <div class="mobile-overlay" (click)="closeMobileMenu()"></div>
  }

  <app-chat-list class="chat-list" (selectChat)="closeMobileMenu()" (openMenu)="toggleMobileMenu()"></app-chat-list>
  <app-chat-area class="chat-area"></app-chat-area>
  <app-call-dialog></app-call-dialog>
</div>
