<div class="home-container">
  <div class="sidebar">
    <div class="sidebar-header">
      <h3>Chat App</h3>
      <button class="new-chat-btn">+</button>
    </div>
    <div class="sidebar-content">
      <input type="text" placeholder="Search" class="search-input" />
      <div class="contact-list">
        <!-- لیست دوستان و گروه‌ها اینجا نمایش داده می‌شود -->
        <div class="contact-item active">
          <div class="avatar"></div>
          <div class="contact-info">
            <h4>John Doe</h4>
            <p>Last message preview...</p>
          </div>
        </div>
        <!-- تکرار برای هر دوست/گروه/چنل -->
      </div>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <div class="chat-info">
        <h4>John Doe</h4>
        <p>Online</p>
      </div>
      <div class="chat-actions">
        <button class="search-btn">🔍</button>
        <button class="more-btn">⋮</button>
      </div>
    </div>
    <div class="chat-content">
      <!-- پیام‌ها اینجا نمایش داده می‌شوند -->
      <div class="message received">
        <p>Hello, how are you?</p>
        <span class="message-time">10:30 AM</span>
      </div>
      <div class="message sent">
        <p>I'm fine, thanks!</p>
        <span class="message-time">10:32 AM</span>
      </div>
      <!-- تکرار برای هر پیام -->
    </div>
    <div class="chat-input-area">
      <input type="text" placeholder="Type a message..." class="chat-input" />
      <button class="send-btn">Send</button>
    </div>
  </div>
</div>
