<div class="chat-area">
  <div class="chat-header">
    <div class="chat-title">Design chat</div>
    <div class="chat-info">23 members, 10 online</div>
    <div class="chat-options">
      <fa-icon [icon]="['fas', 'search']" class="icon"></fa-icon>
      <fa-icon [icon]="['fas', 'ellipsis-h']" class="icon"></fa-icon>
    </div>
  </div>

  <div class="chat-messages">
    <div class="message">
      <div class="avatar"></div>
      <div class="message-content">
        <div class="message-author">Jasmin Lowery</div>
        <div class="message-text">
          I added new flows to our design system...
        </div>
      </div>
      <div class="message-time">09:23</div>
    </div>
  </div>

  <div class="chat-input">
    <input type="text" placeholder="Your message" />
    <fa-icon [icon]="['fas', 'paper-plane']" class="send-icon"></fa-icon>
  </div>
</div>
