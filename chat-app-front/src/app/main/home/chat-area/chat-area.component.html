<div class="chat-area-container">
  @if (mainService.currentChat) {

  <div class="chat-header">
    <div class="chat-header-info">
      <img [src]="mainService.currentChat?.avatar" alt="Avatar" class="chat-avatar" />
      <div class="chat-name">{{ mainService.currentChat?.firstName + " " + mainService.currentChat?.lastName }}</div>
    </div>
    <fa-icon [icon]="['fas', 'ellipsis-v']" class="chat-options-icon"></fa-icon>
  </div>

  <div class="chat-messages">
    @for (message of mainService.currentChat?.messages; track $index) {
    <!-- [ngClass]="{ 'sent': message.isSent, 'received': !message.isSent }" -->
    <div class="message">
      <div class="message-content">{{ message.content }}</div>
      <div class="message-time">{{ message.createdAt | date : "shortTime" }}</div>
    </div>
    }
  </div>

  <div class="chat-input-container">
    <textarea
      #element
      class="chat-input"
      placeholder="پیام خود را بنویسید..."
      (keydown.enter)="mainService.sendMessage(mainService.currentChat, element)"
    ></textarea>
    <fa-icon [icon]="['fas', 'paper-plane']" class="send-icon" (click)="mainService.sendMessage(mainService.currentChat, element)"></fa-icon>
  </div>
  }@else {
  <div class="empty-chat">select a chat ...</div>
  }
</div>
