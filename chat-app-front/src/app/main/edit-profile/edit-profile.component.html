<div class="edit-profile-container">
  <h2 class="edit-profile-title">{{ 'profile.editProfile' | i18n }}</h2>
  <div class="profile-header">
    <div class="profile-picture">
      <img [src]="data?.pictureSrc" alt="Profile Picture" />
      <label for="profile-picture-upload" class="change-picture">
        <fa-icon [icon]="['fas', 'camera']"></fa-icon>
      </label>
      <input type="file" id="profile-picture-upload" (change)="onProfilePictureChange($event)" accept="image/png, image/jpg, image/jpeg" hidden />
    </div>
  </div>
  <div class="profile-form">
    <div class="form-group">
      <label for="firstName">{{ 'contacts.firstName' | i18n }}</label>
      <input id="firstName" type="text" [(ngModel)]="data.firstName" class="form-control" [placeholder]="'profile.firstNameRequired' | i18n" required />
    </div>
    <div class="form-group">
      <label for="lastName">{{ 'contacts.lastName' | i18n }}</label>
      <input id="lastName" type="text" [(ngModel)]="data.lastName" class="form-control" [placeholder]="'profile.lastNameRequired' | i18n" required />
    </div>
    <div class="form-group">
      <label for="bio">{{ 'profile.aboutMe' | i18n }}</label>
      <textarea id="bio" [(ngModel)]="data.bio" class="form-control" [placeholder]="'profile.bioPlaceholder' | i18n"></textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" (click)="onSave()">{{ 'actions.save' | i18n }}</button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()">{{ 'actions.cancel' | i18n }}</button>
    </div>
  </div>
</div>
