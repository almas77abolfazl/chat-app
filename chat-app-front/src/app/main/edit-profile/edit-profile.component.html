<h1 mat-dialog-title>Edit Profile</h1>
<div mat-dialog-content>
  <div class="profile-header">
    <div class="profile-picture">
      <img src="path_to_current_profile_image" alt="Profile Picture" />
      <label for="profile-picture-upload" class="change-picture">
        <fa-icon [icon]="['fas', 'camera']"></fa-icon>
      </label>
      <input type="file" id="profile-picture-upload" (change)="onProfilePictureChange($event)" hidden />
    </div>
  </div>

  <form class="profile-form">
    <div class="form-group">
      <label for="username">Name</label>
      <input type="text" id="username" [(ngModel)]="data.name" class="form-control" />
    </div>

    <div class="form-group">
      <label for="bio">Bio</label>
      <textarea id="bio" [(ngModel)]="data.bio" class="form-control"></textarea>
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <input type="text" id="status" [(ngModel)]="data.status" class="form-control" />
    </div>
  </form>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button (click)="onSave()">Save</button>
</div>
