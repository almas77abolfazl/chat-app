<div class="user-details-container">
  <div class="fill-names-card">
    <h2>Please Complete Your Profile</h2>
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    <form (ngSubmit)="onSubmit()" class="user-details-form">
      <div class="form-group">
        <label for="first-name">First Name</label>
        <input
          type="text"
          id="first-name"
          [(ngModel)]="firstName"
          name="firstName"
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label for="last-name">Last Name</label>
        <input
          type="text"
          id="last-name"
          [(ngModel)]="lastName"
          name="lastName"
          class="form-control"
        />
      </div>
      <button mat-button type="submit" class="submit-button">Continue</button>
    </form>
  </div>
</div>
