<div class="fill-names-container" (keyup.enter)="onSubmit()">
  <div class="fill-bg"></div>

  <div class="fill-top-bar">
    <button class="top-bar-btn" (click)="translationService.switchLanguage()" [attr.aria-label]="'sidebar.language' | i18n" [attr.title]="'sidebar.language' | i18n" type="button">
      <fa-icon [icon]="['fas', translationService.isRTL ? 'language' : 'earth']"></fa-icon>
      <span>{{ translationService.isRTL ? 'English' : 'فارسی' }}</span>
    </button>
    <button class="top-bar-btn theme-toggle-btn" (click)="themeService.toggleTheme()" [attr.aria-label]="'theme.toggle' | i18n" [attr.title]="'theme.toggle' | i18n" type="button">
      <fa-icon [icon]="['fas', themeService.theme === 'dark' ? 'sun' : 'moon']"></fa-icon>
      <span>{{ themeService.theme === 'dark' ? ('theme.lightMode' | i18n) : ('theme.darkMode' | i18n) }}</span>
    </button>
  </div>

  <div class="fill-names-card">
    <div class="brand">
      <div class="brand-icon">
        <fa-icon [icon]="['fas', 'comments']"></fa-icon>
      </div>
      <span class="brand-name">{{ 'brand.name' | i18n }}</span>
    </div>

    <h2 class="fill-title">{{ 'profile.title' | i18n }}</h2>
    <p class="fill-subtitle">{{ 'profile.subtitle' | i18n }}</p>

    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

    <form (ngSubmit)="onSubmit()" class="fill-form">
      <div class="form-row">
        <input
          type="text"
          id="first-name"
          [(ngModel)]="firstName"
          name="firstName"
          class="form-input"
          [placeholder]="'profile.firstNamePlaceholder' | i18n"
          autocomplete="given-name"
        />
      </div>
      <div class="form-row">
        <input
          type="text"
          id="last-name"
          [(ngModel)]="lastName"
          name="lastName"
          class="form-input"
          [placeholder]="'profile.lastNamePlaceholder' | i18n"
          autocomplete="family-name"
        />
      </div>
      <button type="submit" class="submit-btn app-button">{{ 'profile.save' | i18n }}</button>
    </form>
  </div>
</div>
