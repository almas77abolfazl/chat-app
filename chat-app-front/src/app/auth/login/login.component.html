<div class="login-container" (keyup.enter)="sendCode()">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">
        <fa-icon [icon]="['fas', 'comments']"></fa-icon>
      </div>
      <span class="brand-name">{{ 'brand.name' | i18n }}</span>
    </div>

    <h2 class="login-title">{{ 'login.title' | i18n }}</h2>
    <p class="login-subtitle">{{ 'login.subtitle' | i18n }}</p>

    <div class="phone-input-wrapper">
      <span class="phone-prefix">🇮🇷 +98</span>
      <input
        [(ngModel)]="phoneNumber"
        type="tel"
        id="phone"
        class="phone-input"
        [placeholder]="'login.phonePlaceholder' | i18n"
        inputmode="tel"
        maxlength="11"
      />
    </div>

    <button
      class="submit-btn app-button"
      [class.disabled]="!phoneNumber.trim()"
      (click)="sendCode()"
      type="button"
    >
      {{ 'login.sendCode' | i18n }}
    </button>
  </div>
</div>
