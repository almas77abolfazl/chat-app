<div class="login-container" (keyup.enter)="sendCode()">
  <div class="login-bg"></div>

  <div class="login-top-bar">
    <button class="top-bar-btn" (click)="translationService.switchLanguage()" [attr.aria-label]="'sidebar.language' | i18n" [attr.title]="'sidebar.language' | i18n" type="button">
      <fa-icon [icon]="['fas', translationService.isRTL() ? 'language' : 'earth']"></fa-icon>
      <span>{{ translationService.isRTL() ? 'English' : 'فارسی' }}</span>
    </button>
    <button class="top-bar-btn theme-toggle-btn" (click)="themeService.toggleTheme()" [attr.aria-label]="'theme.toggle' | i18n" [attr.title]="'theme.toggle' | i18n" type="button">
      <fa-icon [icon]="['fas', themeService.isDark() ? 'sun' : 'moon']"></fa-icon>
      <span>{{ themeService.isDark() ? ('theme.lightMode' | i18n) : ('theme.darkMode' | i18n) }}</span>
    </button>
  </div>

  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">
        <fa-icon [icon]="['fas', 'comments']"></fa-icon>
      </div>
      <span class="brand-name">{{ 'brand.name' | i18n }}</span>
    </div>

    <h2 class="login-title">{{ 'login.title' | i18n }}</h2>
    <p class="login-subtitle">{{ 'login.subtitle' | i18n }}</p>

    <!-- Unified Phone Input with Country Prefix Dropdown -->
    <div class="phone-field-group">
      <div class="phone-input-wrapper">
        <div class="country-prefix-pill" (click)="toggleCountryMenu(); $event.stopPropagation()">
          <span class="country-flag">{{ currentCountry().flag }}</span>
          <span class="plus-sign">+</span>
          <input
            [(ngModel)]="countryCode"
            type="text"
            class="country-code-input"
            placeholder="98"
            maxlength="4"
            inputmode="numeric"
            aria-label="Country Code"
            (click)="$event.stopPropagation()"
          />
          <fa-icon [icon]="['fas', showCountryMenu() ? 'chevron-up' : 'chevron-down']" class="chevron"></fa-icon>
        </div>

        <input
          [(ngModel)]="phoneNumber"
          type="tel"
          id="phone"
          class="phone-input"
          [placeholder]="'login.phonePlaceholder' | i18n"
          inputmode="tel"
          maxlength="14"
        />
      </div>

      <!-- Dropdown opens directly below the unified input -->
      @if (showCountryMenu()) {
      <div class="country-dropdown" (click)="$event.stopPropagation()">
        <div class="country-search-box">
          <input
            type="text"
            class="country-search-input"
            [placeholder]="'search.placeholder' | i18n"
            [ngModel]="countrySearch()"
            (ngModelChange)="countrySearch.set($event)"
            autofocus
          />
          <fa-icon [icon]="['fas', 'search']" class="search-icon"></fa-icon>
        </div>
        <div class="country-list">
          @for (c of filteredCountries(); track c.code + c.nameEn) {
          <button
            type="button"
            class="country-item"
            [class.selected]="c.code === countryCodeSignal()"
            (click)="selectCountry(c)"
          >
            <span class="item-flag">{{ c.flag }}</span>
            <span class="item-name">{{ translationService.isRTL() ? c.nameFa : c.nameEn }}</span>
            <span class="item-code">+{{ c.code }}</span>
          </button>
          }
        </div>
      </div>
      }
    </div>

    <button
      class="submit-btn app-button"
      [class.disabled]="!phoneNumber.trim()"
      (click)="sendCode()"
      type="button"
    >
      {{ 'login.sendCode' | i18n }}
    </button>
  </div>
</div>
