<div class="login-container">
  <div class="login-box">
    <h2>Welcome Back</h2>
    <p>Please enter your phone number to continue</p>
    <input
      type="text"
      [(ngModel)]="phoneNumber"
      placeholder="Phone Number"
      class="input-field"
    />
    <button (click)="sendCode()" class="submit-btn">Send Code</button>
  </div>
</div>
