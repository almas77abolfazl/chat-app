<div class="verification-container">
  <div class="verification-card">
    <h2 class="verification-title">Enter Verification Code</h2>
    <p class="verification-text">
      We’ve sent a code to your phone {{ phoneNumber }}. Please enter it below.
    </p>
    <div class="input-group">
      <label for="code" class="input-label">Verification Code</label>
      <input
        [(ngModel)]="verificationCode"
        type="text"
        id="code"
        class="input-field"
        placeholder="Enter your code"
      />
    </div>
    <button class="submit-btn" (click)="verifyCode()">Verify Code</button>
  </div>
</div>
