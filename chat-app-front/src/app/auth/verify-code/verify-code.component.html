<div class="verify-container" (keyup.enter)="verifyCode()">
  <div class="verify-bg"></div>

  <div class="verify-top-bar">
    <button class="top-bar-btn" (click)="translationService.switchLanguage()" [attr.aria-label]="'sidebar.language' | i18n" [attr.title]="'sidebar.language' | i18n" type="button">
      <fa-icon [icon]="['fas', translationService.isRTL() ? 'language' : 'earth']"></fa-icon>
      <span>{{ translationService.isRTL() ? 'English' : 'فارسی' }}</span>
    </button>
    <button class="top-bar-btn theme-toggle-btn" (click)="themeService.toggleTheme()" [attr.aria-label]="'theme.toggle' | i18n" [attr.title]="'theme.toggle' | i18n" type="button">
      <fa-icon [icon]="['fas', themeService.isDark() ? 'sun' : 'moon']"></fa-icon>
      <span>{{ themeService.isDark() ? ('theme.lightMode' | i18n) : ('theme.darkMode' | i18n) }}</span>
    </button>
  </div>

  <div class="verify-card">
    <div class="brand">
      <div class="brand-icon">
        <fa-icon [icon]="['fas', 'comments']"></fa-icon>
      </div>
      <span class="brand-name">{{ 'brand.name' | i18n }}</span>
    </div>

    <h2 class="verify-title">{{ 'verify.title' | i18n }}</h2>
    <p class="verify-subtitle" [innerHTML]="'verify.subtitle' | i18n:{ phone: phoneNumber }"></p>

    <div class="otp-inputs" (paste)="onOtpPaste($event)">
      <input
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        class="otp-input"
        [value]="verificationCode[0] && verificationCode[0] !== ' ' ? verificationCode[0] : ''"
        (input)="onOtpInput($event, 0)"
        (keydown.backspace)="onOtpBackspace($event, 0)"
        (paste)="onOtpPaste($event)"
      />
      <input
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        class="otp-input"
        [value]="verificationCode[1] && verificationCode[1] !== ' ' ? verificationCode[1] : ''"
        (input)="onOtpInput($event, 1)"
        (keydown.backspace)="onOtpBackspace($event, 1)"
        (paste)="onOtpPaste($event)"
      />
      <input
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        class="otp-input"
        [value]="verificationCode[2] && verificationCode[2] !== ' ' ? verificationCode[2] : ''"
        (input)="onOtpInput($event, 2)"
        (keydown.backspace)="onOtpBackspace($event, 2)"
        (paste)="onOtpPaste($event)"
      />
      <input
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        class="otp-input"
        [value]="verificationCode[3] && verificationCode[3] !== ' ' ? verificationCode[3] : ''"
        (input)="onOtpInput($event, 3)"
        (keydown.backspace)="onOtpBackspace($event, 3)"
        (paste)="onOtpPaste($event)"
      />
      <input
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        class="otp-input"
        [value]="verificationCode[4] && verificationCode[4] !== ' ' ? verificationCode[4] : ''"
        (input)="onOtpInput($event, 4)"
        (keydown.backspace)="onOtpBackspace($event, 4)"
        (paste)="onOtpPaste($event)"
      />
      <input
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        class="otp-input"
        [value]="verificationCode[5] && verificationCode[5] !== ' ' ? verificationCode[5] : ''"
        (input)="onOtpInput($event, 5)"
        (keydown.backspace)="onOtpBackspace($event, 5)"
        (paste)="onOtpPaste($event)"
      />
    </div>

    <button
      type="button"
      class="submit-btn app-button"
      [class.disabled]="verificationCode.trim().length < 6 || verificationCode.includes(' ')"
      (click)="verifyCode()"
    >
      {{ 'verify.submit' | i18n }}
    </button>

    <div class="resend-section">
      @if (canResend) {
        <button type="button" class="resend-btn" (click)="resendCode()">{{ 'verify.resend' | i18n }}</button>
      } @else {
        <span class="resend-countdown">{{ 'verify.resendCountdown' | i18n:{ seconds: resendSeconds } }}</span>
      }
    </div>
  </div>
</div>
